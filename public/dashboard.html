<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · FindIt</title>
  <meta name="description" content="Your activity and campus-wide lost and found statistics.">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <main id="main" class="container py-4">
    <h1 class="h3 mb-3">Dashboard</h1>

    <section aria-labelledby="mine-title" class="mb-4">
      <h2 id="mine-title" class="h5">Your activity</h2>
      <div class="row g-3" id="my-tiles"></div>
    </section>

    <section aria-labelledby="campus-title" class="mb-4">
      <h2 id="campus-title" class="h5">Campus overview</h2>
      <div class="row g-3 mb-3" id="campus-tiles"></div>
      <div class="row g-3">
        <div class="col-lg-5"><div class="panel h-100"><h3 class="h6">Items by category</h3>
          <div class="chart-box"><canvas id="chart-category" role="img" aria-label="Doughnut chart of items by category"></canvas></div></div></div>
        <div class="col-lg-7"><div class="panel h-100"><h3 class="h6">Reports per week (last 6 weeks)</h3>
          <div class="chart-box"><canvas id="chart-weekly" role="img" aria-label="Bar chart of lost and found reports per week"></canvas></div></div></div>
      </div>
    </section>

    <div class="row g-3">
      <section class="col-lg-6" aria-labelledby="in-title"><div class="panel h-100">
        <h2 id="in-title" class="h5">Claims waiting for your decision</h2><div id="incoming"></div></div></section>
      <section class="col-lg-6" aria-labelledby="out-title"><div class="panel h-100">
        <h2 id="out-title" class="h5">Claims you sent</h2><div id="outgoing"></div></div></section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="vendor/chart.umd.js"></script>
  <script src="js/local-api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
